plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playgameskit'
version = '0.1.1'

android {
  namespace "expo.modules.playgameskit"
  defaultConfig {
    versionCode 1
    versionName "0.1.1"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-games-v2:22.0.0'
}
